<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mobile Emergency Ambulance In-Vehicle Display and Telemetry Beacon">
  <title>Ambulance Operator HUD — Emergency Signal Priority</title>

  <!-- Google Fonts: Newsreader (Claude Serif), Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #141312;
      --bg-surface: #1d1c1a;
      --bg-card: #23221f;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --claude-terracotta: #cc785c;
      --claude-terracotta-subtle: rgba(204, 120, 92, 0.12);
      --sage-green: #34d399;
      --warm-amber: #f59e0b;
      --text-primary: #f4f3ee;
      --text-secondary: #a6a49c;
      --text-muted: #737168;

      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .hud-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .header-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mode-selector {
      display: flex;
      background: var(--bg-card);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 600;
      border: 1px solid var(--border-medium);
    }
    .emergency-btn {
      width: 100%;
      padding: 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border-medium);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .emergency-btn.active {
      background: var(--claude-terracotta);
      color: white;
      border-color: var(--claude-terracotta);
    }
    .emergency-btn.inactive {
      background: var(--bg-card);
      color: var(--text-secondary);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid var(--border-subtle);
    }
    .stat-lbl { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 600; margin-top: 2px; color: var(--text-primary); }
    .corridor-status {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      color: var(--sage-green);
      font-weight: 600;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="hud-card">
      <div class="header-title">
        <span>Vehicle <strong id="amb-id-display" style="font-family: var(--font-mono); font-size: 1.1rem; color: var(--claude-terracotta);">A102</strong></span>
        <span id="beacon-status" style="font-family: var(--font-mono); font-size: 0.72rem; background: var(--claude-terracotta-subtle); color: var(--claude-terracotta); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(204, 120, 92, 0.3);">BEACON IDLE</span>
      </div>

      <!-- Source Mode Selection -->
      <div class="mode-selector">
        <button id="mode-sim-btn" class="mode-btn active" onclick="setTrackingMode('sim')">
          Demo Route (Bangalore)
        </button>
        <button id="mode-gps-btn" class="mode-btn" onclick="setTrackingMode('gps')">
          Phone Live GPS
        </button>
      </div>

      <!-- Emergency Toggle Button -->
      <button id="toggle-emergency-btn" class="emergency-btn inactive" onclick="toggleEmergencyMode()">
        <span>START EMERGENCY PRIORITY</span>
      </button>

      <!-- Corridor Status HUD -->
      <div id="corridor-status-box" class="corridor-status" style="display: none;">
        <span>🟢 GREEN CORRIDOR GRANTED</span>
      </div>

      <!-- Live Stats -->
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-lbl">Speed</div>
          <div id="hud-speed" class="stat-val">0 km/h</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Upcoming Signal</div>
          <div id="hud-junction" class="stat-val" style="font-size: 1rem; line-height: 1.2rem;">--</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Distance</div>
          <div id="hud-distance" class="stat-val">-- m</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Estimated Arrival</div>
          <div id="hud-eta" class="stat-val" style="color: var(--warm-amber);">-- s</div>
        </div>
      </div>

      <!-- Telemetry Diagnostics Footer -->
      <div style="background: var(--bg-card); border-radius: 6px; padding: 8px 10px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-subtle);">
        <div>
          <span id="coord-mode-tag" style="color: var(--claude-terracotta); font-weight: 500;">Demo Corridor Drive (Bangalore)</span><br>
          <span id="hud-coords" style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.7rem;">12.98300, 77.60740</span>
        </div>
        <div style="text-align: right;">
          <span style="color: var(--text-muted);">Packets Sent</span><br>
          <span id="hud-packets" style="color: var(--sage-green); font-family: var(--font-mono); font-weight: 600;">#0</span>
        </div>
      </div>

      <div style="font-size: 0.72rem; color: var(--text-muted); text-align: center;">
        AWS IoT Core Telemetry Link & Real-Time Traffic Priority
      </div>
    </div>
  </div>

  <script src="/static/js/ambulance_app.js"></script>
</body>
</html>
